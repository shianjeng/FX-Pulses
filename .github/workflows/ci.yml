name: CI

on:
  push:
  pull_request:
  schedule:
    # Upstream layout changes are invisible to unit tests, whose fixtures encode
    # the same assumptions as the parsers. Only a live call can catch them.
    - cron: "17 6 * * *"

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FX_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Migrations apply to an empty database
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_check.db

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check:config
      - run: npm run lint
      - run: npm test

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension and API versions agree
        run: |
          manifest=$(node -p 'require("./extension/manifest.json").version')
          api=$(grep -m1 -Po '(?<=^version = ")[^"]+' backend/pyproject.toml)
          app=$(grep -m1 -Po '(?<=version=")[^"]+' backend/app/main.py)
          echo "manifest=$manifest api=$api app=$app"
          test "$manifest" = "$api" && test "$api" = "$app"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fx-pulse-api:ci ./backend

  official-sources:
    # Scheduled runs only: a live check must not make ordinary pushes red.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FX_PROVIDER: mock
      OFFICIAL_SOURCES: ecb,bank_of_canada,federal_reserve,bank_of_japan,pboc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Verify every official source against its live endpoint
        run: python -m app.check_official
