name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Legacy parser fixtures still pass
        run: node userscript/node-check.mjs
      - name: Card rendering contract
        run: node userscript/dom-smoke.cjs
      - name: Generated parser matches its source
        run: |
          node userscript/build-extension-parser.mjs
          git diff --exit-code -- extension/amount-parser.js
