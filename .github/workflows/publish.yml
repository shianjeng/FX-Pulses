name: Publish static backend

# Collects a round of rates and publishes the read-only API as static JSON on
# GitHub Pages, so the extension needs no server and no user needs a key.
#
# The runner is destroyed after every run, but history has to survive it or the
# 90-day chart would only ever hold one point. The SQLite file therefore lives
# on an orphan `data` branch that this job force-pushes as a single commit:
# always one copy of the database, never a growing pile of binary diffs.

on:
  schedule:
    # GitHub starts scheduled runs late and sometimes drops them, most of all
    # near the top of the hour: on the first day a "5 */4" schedule ran 4 times
    # in 28 hours, up to 3.5 hours late, and the data went stale. Ask every hour
    # at an off-peak minute; the `due` job lets a run through only once the
    # published data is about three hours old, so the Alpha Vantage budget holds
    # while a dropped run costs an hour, not four.
    #
    # Hourly was not enough either: from 23 to 29 September 2026 GitHub started
    # only about one in five of these hourly runs, 3 to 8.5 hours apart. Each
    # entry below is another chance to be started; a run that finds nothing due
    # stops after the few seconds the `due` job takes. An external pinger can
    # still fill the gaps through workflow_dispatch with force=false (see
    # "Keeping the data fresh" in the README); it passes the same gate.
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Collect even if the published data is still fresh
        type: boolean
        default: true

concurrency:
  # Two overlapping runs would race on the data branch and lose a collection.
  group: publish-static
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether a collection is due
        id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          RATES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/v1/rates.json
        run: |
          # A manual run always collects; a pinger dispatching with force=false
          # goes through the same gate as the schedule.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" != "false" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Minutes since the OLDEST published quote. The market job used to be
          # read instead, but it counts as successful when one pair of three
          # arrives, and on 29 September that left two pairs 13 hours behind.
          # Unreadable or empty data counts as due: a spare run beats a missed one.
          age=$(curl -fsS "$RATES" | jq -r --argjson now "$(date +%s)" '
            [.[]?.captured_at | sub("\\.[0-9]+"; "") | fromdateiso8601] | min // empty
            | ($now - .) / 60 | floor') || age=""
          echo "oldest published quote is ${age:-of unknown} age (minutes)"
          # 180 minutes: at most eight collections of three pairs in any 24 hours,
          # 24 calls against the 25-call budget the collector enforces.
          if [ -n "$age" ] && [ "$age" -lt 180 ]; then echo "run=false"; else echo "run=true"; fi >> "$GITHUB_OUTPUT"

  publish:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FX_PROVIDER: alpha_vantage
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      OFFICIAL_SOURCES: ecb,bank_of_canada,federal_reserve,bank_of_japan,pboc
      DATABASE_URL: sqlite:///./fx_pulse.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"
        working-directory: backend

      - name: Restore the collected history
        run: |
          # First run has no data branch yet; start from an empty database.
          if git fetch origin data --depth 1 2>/dev/null; then
            git show origin/data:fx_pulse.db > backend/fx_pulse.db
            echo "restored $(stat -c%s backend/fx_pulse.db) bytes of history"
          else
            echo "no data branch yet, starting fresh"
          fi

      - name: Apply migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Collect one round
        # Pairs quoted in the last two hours are left out, so a round that runs
        # because one pair fell behind does not spend budget on the others.
        run: python -m app.collector --once --skip-fresh 120
        working-directory: backend

      - name: Export the API as static files
        run: python -m app.export_static --out ../public/api/v1
        working-directory: backend

      - name: Persist the history
        run: |
          # Built in a scratch repository rather than by branching this one:
          # rewriting HEAD in the workspace leaves the checked-out files
          # untracked, which strands the export the next step has to upload.
          # A fresh repository also guarantees the single commit that keeps the
          # branch from growing by one binary blob per collection.
          scratch="$(mktemp -d)"
          cp backend/fx_pulse.db "$scratch/fx_pulse.db"
          cd "$scratch"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_pulse.db
          git commit -qm "data: collected $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force -q \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data:data
        env:
          GIT_TERMINAL_PROMPT: "0"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deploy
