[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "fx-pulse-api"
version = "2.8.5"
description = "Public exchange-rate midpoint API for a login-free browser extension"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  # Floor for the Host-header, form-limit and Range-header advisories fixed in 0.49.1 to 1.3.1.
  "starlette>=1.3.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.1",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "apscheduler==3.11.3",
  "alembic>=1.16,<2",
  "filelock>=3.18,<4",
  "tzdata>=2025.2",
  "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
