services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fxpulse
      POSTGRES_USER: fxpulse
      POSTGRES_PASSWORD: fxpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fxpulse:fxpulse@db:5432/fxpulse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
