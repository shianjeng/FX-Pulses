<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="FX Pulse">
  <!-- Straight strokes sit on 4n+2, so at 32 px (the toolbar on a Retina screen)
       every edge lands on a pixel. The arrowheads stop short of each other: meeting
       on the centre line, they merged into one block at toolbar size. 16.png is
       drawn from icon-16.svg, simplified for that size. -->
  <defs>
    <linearGradient id="fx-icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaeff4"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#fx-icon-bg)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" fill="none" stroke="#c9d3dd" stroke-width="1.5"/>
  <g fill="none" stroke-width="12" stroke-linejoin="round">
    <path d="M22 86V42H42M22 62H38" stroke="#121c28" stroke-linecap="round"/>
    <path d="M62 42L106 86" stroke="#c53650" stroke-linecap="round"/>
    <path d="M88 86H106V68" stroke="#c53650"/>
    <path d="M62 86L106 42" stroke="#0b8a6f" stroke-linecap="round"/>
    <path d="M88 42H106V60" stroke="#0b8a6f"/>
  </g>
</svg>
