<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FX Pulse</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="converter.css" />
    <link rel="stylesheet" href="official.css" />
    <link rel="stylesheet" href="popup-chart.css" />
    <link rel="stylesheet" href="liquid-glass.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img class="brand-logo" src="icons/icon.svg" width="32" height="32" alt="" /><span class="brand-name">FX Pulse</span></div>
      <div class="header-actions"><span class="privacy" data-i18n="noAccount">免登录</span><button id="settings-button" class="icon" data-i18n-attr="title:settings,aria-label:settings" title="设置" aria-label="设置">⚙</button></div>
    </header>

    <main>
      <section class="market-head">
        <div><p class="eyebrow" data-i18n="explorerEyebrow">货币查询</p><h1 data-i18n="explorerTitle">汇率查询</h1></div>
        <button id="refresh-button" class="icon" data-i18n-attr="title:refresh,aria-label:refresh" title="刷新" aria-label="刷新">↻</button>
      </section>
      <p id="status" class="status" data-i18n="loadingRates">正在读取行情…</p>
      <p class="hint" data-i18n="refreshHint">刷新只重新读取后端数据，不会立即触发上游采集。</p>
      <div id="error" class="error hidden"></div>
        <div class="currency-selects">
          <label><span data-i18n="converterFromCurrency">从</span><select id="converter-from" data-i18n-attr="aria-label:converterFromCurrency" aria-label="源货币"></select></label>
          <label><span data-i18n="converterToCurrency">到</span><select id="converter-to" data-i18n-attr="aria-label:converterToCurrency" aria-label="目标货币"></select></label>
        </div>
      <button id="reverse-button" class="mini">⇄ <span data-i18n="reverse">反转</span></button>
      <section id="rates" class="rate-list" aria-live="polite"></section>

      <section class="panel official-panel">
        <div class="panel-title">
          <div><p class="eyebrow" data-i18n="eyebrowOfficial">官方参考价</p><h2 id="official-title" data-i18n="officialTitle">官方参考价</h2></div>
          <span class="reference-badge" data-i18n="daily">日更</span>
        </div>
        <p id="official-status" class="hint" data-i18n="loadingOfficial">正在读取官方参考价…</p>
        <div id="official-rates" class="official-list" aria-live="polite"></div>
      </section>

      <section class="panel trend-panel">
        <div class="panel-title"><div><p class="eyebrow" data-i18n="eyebrowTrend">价格走势</p><h2 id="trend-title" data-i18n="trendTitle">汇率走势</h2></div><span id="trend-change" class="change">—</span></div>
        <div id="range-buttons" class="range-buttons" role="group" data-i18n-attr="aria-label:rangeGroup" aria-label="历史区间">
          <button type="button" class="mini" data-days="1">1D</button>
          <button type="button" class="mini selected" data-days="7">7D</button>
          <button type="button" class="mini" data-days="30">30D</button>
          <button type="button" class="mini" data-days="90">90D</button>
        </div>
        <div id="chart" class="chart"><span data-i18n="loadingChart">载入走势…</span></div>
        <div class="stats"><span><span data-i18n="statLow">低</span> <b id="stat-low">—</b></span><span><span data-i18n="statHigh">高</span> <b id="stat-high">—</b></span><span><span data-i18n="statRange">区间</span> <b id="stat-position">—</b></span></div>
      </section>

      <section class="panel">
        <div class="panel-title"><div><p class="eyebrow" data-i18n="eyebrowConverter">快捷换算</p><h2 data-i18n="converterTitle">快捷换算</h2></div></div>
        <div class="converter">
          <label><span id="from-label" data-i18n="amountLabel">金额</span><input id="amount" type="number" min="0" step="any" value="1000" /></label>
          <label><span id="to-label" data-i18n="convertedLabel">换算结果</span><output id="converted">—</output></label>
        </div>
        <p id="amount-error" class="hint" role="status"></p>
        <p id="conversion-rate" class="hint" aria-live="polite"></p>
        <p class="hint" data-i18n="displayRoundingHint">汇率显示值经过四舍五入；换算使用完整精度，结果保留两位小数。</p>
        <p id="converter-status" class="hint" role="status"></p>
        <p class="hint" data-i18n="converterHint">优先使用市场中间价；无市场行情时使用标明来源和日期的官方日参考价。不包含手续费与点差。</p>
      </section>

      <details class="panel collapsible">
        <summary><span data-i18n="targetTitle">目标价状态</span><small id="target-mode" data-i18n="targetOnOpen">仅打开插件时检查</small></summary>
        <form id="target-form">
          <div class="form-row"><select id="target-pair"></select><select id="target-direction"><option value="above" data-i18n="above">高于或等于</option><option value="below" data-i18n="below">低于或等于</option></select></div>
          <input id="target-value" type="number" min="0" step="any" data-i18n-attr="placeholder:targetPlaceholder" placeholder="输入目标中间价" required />
          <button class="primary" type="submit" data-i18n="saveLocal">保存到本机</button>
          <p id="target-message" class="target-message"></p>
        </form>
      </details>

      <details class="panel collapsible">
        <summary><span data-i18n="manageWatchlist">管理自选</span><small data-i18n="savedLocally">设置保存在本机</small></summary>
        <div id="watchlist-options" class="watchlist-options"></div>
      </details>

      <p class="hint" data-i18n="midpointDisclaimer">市场中间价为买卖报价的平均值，非人民币官方中间价或银行成交价。仅供参考。</p>
      <footer><span data-i18n="midpointFormula">中间价 =（买入价 + 卖出价）÷ 2</span><button id="copy-button" data-i18n="copyRate">复制当前汇率</button></footer>
      <label id="copy-fallback" class="hidden hint"><span data-i18n="copyManual">自动复制失败，请按 Ctrl/Cmd+C 手动复制</span><input id="copy-value" readonly /></label>
    </main>
    <script src="messages.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
